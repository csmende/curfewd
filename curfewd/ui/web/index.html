<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>curfewd — Screen Time Control</title>
  <link rel="stylesheet" href="curfewd://app/styles.css" />
</head>
<body>
  <div id="root">
    <div class="centered-view">
      <div class="auth-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div class="card-sub">Loading screen-time status...</div>
      </div>
    </div>
  </div>

  <div id="unsavedBar" class="unsaved-bar" role="status" aria-live="polite">
    <span class="unsaved-text">You have unsaved schedule changes</span>
    <button type="button" class="btn btn-outlined btn-sm" id="btnDiscard">Discard</button>
    <button type="button" class="btn btn-filled btn-sm" id="btnSave">Save Changes</button>
  </div>

  <div id="modalBg" class="modal-bg" role="dialog" aria-modal="true">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>

  <script src="curfewd://app/app.js"></script>
</body>
</html>
