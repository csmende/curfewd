name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish .deb Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            dbus \
            debhelper \
            dh-python \
            dpkg-dev \
            gir1.2-gtk-3.0 \
            libglib2.0-bin \
            po-debconf \
            python3 \
            python3-dbus \
            python3-gi \
            python3-psutil

      - name: Run test suite
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: Build .deb and checksums
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../curfewd_*.deb dist/
          (cd dist && sha256sum curfewd_*.deb > SHA256SUMS)
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release create "$TAG" dist/curfewd_*.deb dist/SHA256SUMS \
            --title "curfewd $TAG" \
            --generate-notes
