name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bandit with SARIF formatter
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "bandit[sarif]"

      - name: Run Bandit across common, client, and server
        run: |
          bandit -r common client server -f txt || true
          bandit -r common client server -f sarif -o bandit.sarif || true

      - name: Upload Bandit SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Fail if Bandit reported Medium or High severity findings
        run: |
          bandit -r common client server -ll

  shellcheck:
    name: ShellCheck Maintainer & Helper Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck on root-executed scripts
        run: |
          shellcheck --severity=warning \
            bin/curfewctl \
            bin/curfewd \
            bin/timekpra \
            bin/timekprc \
            bin/timekprd \
            debian/postinst \
            debian/postrm \
            extras/dconf-lock-screensaver.sh
