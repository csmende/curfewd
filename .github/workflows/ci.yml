name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Live D-Bus Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python runtime and D-Bus test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus \
            libglib2.0-bin \
            python3 \
            python3-dbus \
            python3-gi \
            python3-psutil

      - name: Syntax check all Python sources
        run: |
          /usr/bin/python3 -m compileall -q curfewd tests

      - name: Run unit and live D-Bus integration tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v

  build-deb:
    name: Build & Verify .deb Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Debian packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-python \
            dpkg-dev \
            lintian \
            python3 \
            python3-dbus \
            python3-gi

      - name: Build binary .deb package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../curfewd_*.deb dist/
          ls -lh dist/

      - name: Inspect package metadata and file listing
        run: |
          dpkg-deb -I dist/curfewd_*.deb
          dpkg-deb -c dist/curfewd_*.deb | head -n 90

      - name: Run lintian diagnostics
        run: |
          lintian --info dist/curfewd_*.deb || true

      - name: Smoke-test .deb installation
        run: |
          sudo apt-get install -y ./dist/curfewd_*.deb
          test -x /usr/bin/curfewctl
          test -x /usr/bin/curfewd
          test -x /usr/bin/curfewd-tray
          test -f /usr/lib/python3/dist-packages/curfewd/engine/screenlock.py
          test -f /usr/lib/systemd/system/curfewd.service
          test -f /usr/share/dbus-1/system.d/org.curfewd.Daemon1.conf
          test -f /usr/share/polkit-1/actions/org.curfewd.policy
          test -f /etc/xdg/autostart/curfewd-tray.desktop
          test -x /usr/share/doc/curfewd/examples/dconf-lock-screensaver.sh
          /usr/bin/curfewctl --version
          /usr/bin/curfewctl --help >/dev/null
          /usr/bin/python3 -c "import curfewd, curfewd.engine.screenlock as s; print('Imported curfewd', curfewd.__version__, 'backends:', list(s.BACKENDS))"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: curfewd-deb
          path: dist/curfewd_*.deb
