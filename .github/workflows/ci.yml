name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ruff and Mypy
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff mypy

      - name: Run Ruff linter and format check
        run: |
          ruff check curfewd tests
          ruff format --check curfewd tests

      - name: Run Mypy static type check
        run: |
          mypy curfewd

      - name: Syntax check Material Design 3 web UI JavaScript
        run: |
          for f in curfewd/ui/web/app.js curfewd/ui/web/js/*.js; do
            node --check "$f"
          done

  test:
    name: Unit & Live D-Bus Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python runtime and D-Bus test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus \
            libglib2.0-bin \
            python3 \
            python3-dbus \
            python3-gi \
            python3-hypothesis \
            python3-psutil \
            zbar-tools

      - name: Syntax check all Python sources
        run: |
          /usr/bin/python3 -m compileall -q curfewd tests

      - name: Run unit and live D-Bus integration tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v

  build-deb:
    name: Build & Verify .deb Package
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Debian packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dh-python \
            dpkg-dev \
            lintian \
            python3 \
            python3-dbus \
            python3-gi \
            python3-psutil

      - name: Build binary .deb package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../curfewd_*.deb dist/
          ls -lh dist/

      - name: Inspect package metadata and file listing
        run: |
          dpkg-deb -I dist/curfewd_*.deb
          dpkg-deb -c dist/curfewd_*.deb | head -n 90

      - name: Verify .deb manifest, AST imports, and isolated archive imports
        run: |
          /usr/bin/python3 tests/verify_deb.py dist/curfewd_*.deb

      - name: Run lintian diagnostics
        run: |
          lintian --info dist/curfewd_*.deb || true

      - name: Smoke-test .deb installation
        run: |
          sudo apt-get install -y ./dist/curfewd_*.deb
          test -x /usr/bin/curfewctl
          test -x /usr/bin/curfewd
          test -x /usr/bin/curfewd-tray
          test -x /usr/bin/curfewd-ui
          test -f /usr/lib/python3/dist-packages/curfewd/auth_code.py
          test -f /usr/lib/python3/dist-packages/curfewd/cli/formatters.py
          test -f /usr/lib/python3/dist-packages/curfewd/engine/screenlock.py
          test -f /usr/lib/python3/dist-packages/curfewd/engine/applimits.py
          test -f /usr/lib/python3/dist-packages/curfewd/engine/runtime.py
          test -f /usr/lib/python3/dist-packages/curfewd/tray/hud.py
          test -f /usr/lib/python3/dist-packages/curfewd/tray/osd.py
          test -f /usr/lib/python3/dist-packages/curfewd/ui/bridge.py
          test -f /usr/share/curfewd/ui/index.html
          test -f /usr/share/curfewd/ui/styles.css
          test -f /usr/share/curfewd/ui/app.js
          test -f /usr/share/curfewd/ui/js/rpc.js
          test -f /usr/share/curfewd/ui/js/state.js
          test -f /usr/share/curfewd/ui/js/views.js
          test -f /usr/share/curfewd/ui/js/views_schedule.js
          test -f /usr/share/curfewd/ui/js/events.js
          test -f /usr/lib/systemd/system/curfewd.service
          test -f /usr/lib/systemd/user/curfewd-tray.service
          test -f /usr/share/dbus-1/system.d/org.curfewd.Daemon1.conf
          test -f /usr/share/polkit-1/actions/org.curfewd.policy
          test -f /etc/xdg/autostart/curfewd-tray.desktop
          test -f /usr/share/applications/curfewd.desktop
          test -f /usr/share/metainfo/org.curfewd.curfewd.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/curfewd.svg
          test -f /usr/share/curfewd/icons/curfewd-tray-ok.svg
          test -f /usr/share/curfewd/icons/curfewd-tray-warning.svg
          test -f /usr/share/curfewd/icons/curfewd-tray-alert.svg
          test -f /usr/share/curfewd/icons/curfewd-tray-unlimited.svg
          test ! -e /usr/share/curfewd/icons/timekpr-padlock-limited-green.svg
          test -x /usr/share/doc/curfewd/examples/dconf-lock-screensaver.sh
          /usr/bin/python3 tests/verify_deb.py --installed dist/curfewd_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: curfewd-deb
          path: dist/curfewd_*.deb
