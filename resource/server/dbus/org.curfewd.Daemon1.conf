<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
    <!-- Only root may own the org.curfewd.Daemon1 system service -->
    <policy user="root">
        <allow own="org.curfewd.Daemon1"/>
        <allow send_destination="org.curfewd.Daemon1"/>
    </policy>

    <!-- Local callers may invoke Admin (gated in-daemon by Polkit / curfewd group)
         and Client (strictly bound to caller Unix UID in-daemon) -->
    <policy context="default">
        <allow send_destination="org.curfewd.Daemon1" send_interface="org.freedesktop.DBus.Introspectable"/>
        <allow send_destination="org.curfewd.Daemon1" send_interface="org.curfewd.Daemon1.Admin"/>
        <allow send_destination="org.curfewd.Daemon1" send_interface="org.curfewd.Daemon1.Client"/>
        <allow receive_sender="org.curfewd.Daemon1" receive_interface="org.curfewd.Daemon1.Events"/>
    </policy>
</busconfig>
