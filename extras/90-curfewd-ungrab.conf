# Optional Xorg drop-in for curfewd
#
# Enables XF86Ungrab so fullscreen X11 games and apps (Steam/Proton, SDL2,
# Minecraft, Roblox Sober, VirtualBox) release pointer/keyboard grabs
# immediately when curfewd locks the screen — without having to un-fullscreen
# or minimize the game window first.
#
# Install:
#   sudo install -m 0644 -D /usr/share/doc/curfewd/examples/90-curfewd-ungrab.conf \
#       /etc/X11/xorg.conf.d/90-curfewd-ungrab.conf
# Then log out and back in (or reboot) for Xorg to pick it up.
#
# Security note:
#   Xorg disables AllowDeactivateGrabs by default because XF86Ungrab can break
#   active X11 input grabs. Modern Cinnamon/GNOME/XFCE lock screens still require
#   PAM authentication to unlock and are not bypassed by ungrabbing client apps,
#   but only install this drop-in if you want zero-minimize fullscreen game locking.
Section "ServerFlags"
    Option "AllowDeactivateGrabs" "True"
EndSection
